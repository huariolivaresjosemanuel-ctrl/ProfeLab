
name: ProfeLab Android

on:
  workflow_dispatch:
    inputs:
      run_emulator:
        description: Ejecutar pruebas Android en emulador
        required: true
        type: boolean
        default: true

  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: profelab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar ProfeLab
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar plataformas Android
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verificar estructura y datos
        run: python3 scripts/verify_project.py

      - name: Permitir ejecucion de Gradle
        run: chmod +x gradlew

      - name: Compilar y ejecutar pruebas
        run: |
          ./gradlew --no-daemon --stacktrace \
            :core:model:test \
            :core:security:test \
            testDebugUnitTest \
            lintDebug \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest \
            :core:database:assembleDebugAndroidTest

      - name: Publicar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: ProfeLab-H1-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar informes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-H1-${{ github.run_number }}
          path: |
            **/build/reports/**
            **/build/test-results/**
            core/database/schemas/**
            docs/qa/static-checks.json
          retention-days: 30

  android-tests:
    name: Pruebas Android API ${{ matrix.api }}

    if: github.event_name == 'workflow_dispatch' && inputs.run_emulator
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Habilitar aceleracion KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Ejecutar pruebas Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace \
              :core:database:connectedDebugAndroidTest \
              :app:connectedDebugAndroidTest

      - name: Guardar resultados Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-api-${{ matrix.api }}-${{ github.run_number }}
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
            **/build/outputs/connected_android_test_additional_output/**
          retention-days: 30
