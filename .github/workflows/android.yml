
name: ProfeLab Android

on:
  workflow_dispatch:
    inputs:
      run_emulator:
        description: Ejecutar pruebas Android en emulador
        required: true
        type: boolean
        default: true
      signed_release:
        description: Generar APK de actualización con la clave permanente del usuario
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: profelab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar ProfeLab
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Normalizar y validar finales LF
        run: |
          python3 scripts/normalize_shell_sources.py
          python3 scripts/normalize_shell_sources.py --check

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar plataformas Android
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verificar estructura y datos
        env:
          SIGNED_REQUEST: ${{ inputs.signed_release }}
          EMULATOR_REQUEST: ${{ inputs.run_emulator }}
        run: |
          if [ "$SIGNED_REQUEST" = "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "La entrega firmada se genera exclusivamente desde main."
            exit 1
          fi
          if [ "$SIGNED_REQUEST" = "true" ] && [ "$EMULATOR_REQUEST" != "true" ]; then
            echo "La entrega firmada requiere activar las pruebas Android."
            exit 1
          fi
          python3 scripts/verify_project.py
          python3 -m unittest discover -s scripts -p 'test_inventory_schema.py' -v
          python3 -m unittest discover -s scripts -p 'test_normalize_shell_sources.py' -v
          python3 -m unittest discover -s scripts -p 'test_signing.py' -v
          python3 -m unittest discover -s scripts -p 'test_android_orchestration.py' -v
          python3 scripts/check_flow_assets.py
          python3 -m unittest discover -s scripts -p 'test_flow_assets.py' -v

      - name: Permitir ejecucion de Gradle
        run: chmod +x gradlew

      - name: Compilar y ejecutar pruebas unitarias
        run: |
          ./gradlew --no-daemon --stacktrace --continue \
            :core:model:test \
            :core:security:test \
            testDebugUnitTest \
            lintDebug \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest \
            :core:database:assembleDebugAndroidTest

      - name: Publicar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: ProfeLab-V1.0.2-DEBUG-no-distribuir-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar informes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-V1.0.2-${{ github.run_number }}
          path: |
            **/build/reports/**
            **/build/test-results/**
            core/database/schemas/**
            docs/qa/static-checks.json
          retention-days: 30

  android-tests:
    name: Pruebas Android API ${{ matrix.api }}

    if: github.event_name == 'workflow_dispatch' && inputs.run_emulator
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            target: default
          - api: 36
            target: google_apis

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Normalizar y validar finales LF
        run: |
          python3 scripts/normalize_shell_sources.py
          python3 scripts/normalize_shell_sources.py --check

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Habilitar aceleracion KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instalar plataforma de compilacion
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Ejecutar pruebas Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.target }}
          disable-animations: true
          script: bash scripts/run_android_checks.sh

      - name: Guardar resultados Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-api-${{ matrix.api }}-${{ github.run_number }}
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
            **/build/outputs/connected_android_test_additional_output/**
          retention-days: 30

  signed-release:
    name: APK con firma permanente del usuario
    if: github.event_name == 'workflow_dispatch' && inputs.signed_release
    needs: [build, android-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PROFELAB_SIGNING_CERT_SHA256: ${{ vars.PROFELAB_SIGNING_CERT_SHA256 }}
      PROFELAB_LAST_DISTRIBUTED_VERSION_CODE: ${{ vars.PROFELAB_LAST_DISTRIBUTED_VERSION_CODE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Normalizar y validar finales LF
        run: |
          python3 scripts/normalize_shell_sources.py
          python3 scripts/normalize_shell_sources.py --check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Instalar plataforma y herramientas de firma
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Número de actualización y rutas temporales
        run: |
          echo "PROFELAB_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "PROFELAB_KEYSTORE_PATH=$RUNNER_TEMP/profelab-signing/release.keystore" >> "$GITHUB_ENV"
          echo "PROFELAB_APKSIGNER=$ANDROID_HOME/build-tools/35.0.0/apksigner" >> "$GITHUB_ENV"
          echo "PROFELAB_AAPT=$ANDROID_HOME/build-tools/35.0.0/aapt" >> "$GITHUB_ENV"
      - name: Validar configuración y reconstruir clave temporal
        env:
          PROFELAB_KEYSTORE_BASE64: ${{ secrets.PROFELAB_KEYSTORE_BASE64 }}
          PROFELAB_KEYSTORE_PASSWORD: ${{ secrets.PROFELAB_KEYSTORE_PASSWORD }}
          PROFELAB_KEY_ALIAS: ${{ secrets.PROFELAB_KEY_ALIAS }}
          PROFELAB_KEY_PASSWORD: ${{ secrets.PROFELAB_KEY_PASSWORD }}
        run: python3 scripts/signing.py prepare
      - name: Compilar release con firma estable y ejecutar lint release
        env:
          PROFELAB_SIGN_RELEASE: 'true'
          PROFELAB_KEYSTORE_PASSWORD: ${{ secrets.PROFELAB_KEYSTORE_PASSWORD }}
          PROFELAB_KEY_ALIAS: ${{ secrets.PROFELAB_KEY_ALIAS }}
          PROFELAB_KEY_PASSWORD: ${{ secrets.PROFELAB_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache :app:lintRelease :app:assembleRelease
      - name: Verificar firma y certificado esperado antes de publicar
        run: python3 scripts/signing.py verify --apk app/build/outputs/apk/release/app-release.apk --output "$RUNNER_TEMP/profelab-public-release"
      - name: Eliminar clave temporal
        if: always()
        run: python3 scripts/signing.py cleanup
      - name: Publicar exclusivamente APK verificada y huellas públicas
        uses: actions/upload-artifact@v4
        with:
          name: ProfeLab-V1.0.2-FIRMA-PERMANENTE-${{ github.run_number }}
          path: ${{ runner.temp }}/profelab-public-release/
          if-no-files-found: error
          retention-days: 30


